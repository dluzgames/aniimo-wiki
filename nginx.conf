server {
    listen 80;
    server_name localhost aniimo.dluz.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for maximum speed & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/woff2;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Clean URLs & SPA routing
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Static Assets Long-Term Caching
    location ~* \.(?:css|js|woff2|woff|ttf|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # High-Res Media & Images Caching
    location ~* \.(?:png|jpg|jpeg|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Skill VFX Videos with HTTP Range Request Support
    location ~* \.mp4$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Accept-Ranges bytes;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Nuxt Payloads & API Data
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # Custom Error Pages
    error_page 404 /index.html;
}
